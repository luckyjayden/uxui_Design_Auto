/* Layout: 검정 사이드 레일 + 흰 작업면. VinylC 모노크롬·직각·무그림자, 위계는 보더 두께로. 상태는 면/외곽선/점선 형태로 구분하고 반려·위험에만 신호색 1개 */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#525252; --ink-3:#8C8C8C;
  --line:#E6E6E6; --line-2:#D4D4D4; --strong:#1A1A1A; --muted:#F3F3F3;
  --inverse:#0D0D0D; --inverse-ink:#FFFFFF; --inverse-2:#A3A3A3; --inverse-line:#2A2A2A;
  --signal:#C2372B; --signal-bg:#FBEDEB; --ok-bg:#EFEFEF;
  --thumb-bg:#F3F3F3; --thumb-ink:#1A1A1A; --thumb-mid:#9A9A9A; --thumb-lt:#D9D9D9; --thumb-paper:#FFFFFF;
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs-xs:11px; --fs-s:12.5px; --fs-m:14px; --fs-l:16px; --fs-xl:20px; --fs-2xl:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#181818; --ink:#F2F2F2; --ink-2:#B5B5B5; --ink-3:#7A7A7A;
  --line:#2C2C2C; --line-2:#3A3A3A; --strong:#F2F2F2; --muted:#222222;
  --inverse:#000000; --inverse-ink:#FFFFFF; --inverse-2:#8A8A8A; --inverse-line:#262626;
  --signal:#F0705F; --signal-bg:#3A1C18; --ok-bg:#262626;
  --thumb-bg:#222222; --thumb-ink:#EDEDED; --thumb-mid:#7A7A7A; --thumb-lt:#3A3A3A; --thumb-paper:#2C2C2C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#181818; --ink:#F2F2F2; --ink-2:#B5B5B5; --ink-3:#7A7A7A;
  --line:#2C2C2C; --line-2:#3A3A3A; --strong:#F2F2F2; --muted:#222222;
  --inverse:#000000; --inverse-ink:#FFFFFF; --inverse-2:#8A8A8A; --inverse-line:#262626;
  --signal:#F0705F; --signal-bg:#3A1C18; --ok-bg:#262626;
  --thumb-bg:#222222; --thumb-ink:#EDEDED; --thumb-mid:#7A7A7A; --thumb-lt:#3A3A3A; --thumb-paper:#2C2C2C;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-m);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--inverse);color:var(--inverse-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid var(--inverse-line)}
.brand img{width:30px;height:30px}
.brand b{display:block;font-size:13px;font-weight:800;letter-spacing:.02em}
.brand span{display:block;font-size:11px;color:var(--inverse-2)}
.nav{display:flex;flex-direction:column;padding:10px 0;gap:0;overflow:auto;flex:1}
.nav .grp{font-size:10.5px;letter-spacing:.12em;color:var(--inverse-2);padding:14px 18px 6px;text-transform:uppercase}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;text-decoration:none;color:#D9D9D9;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:#1C1C1C;color:#fff}
.nav a.on{color:#fff;border-left-color:#fff;background:#1A1A1A;font-weight:700}
.nav a .cnt{font-family:var(--mono);font-size:11px;background:#fff;color:#0D0D0D;padding:0 6px;min-width:20px;text-align:center}
.rail-foot{padding:14px 18px;border-top:1px solid var(--inverse-line);font-size:11px;color:var(--inverse-2);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.crumb{flex:1;min-width:0;font-size:12px;color:var(--ink-3)}
.crumb b{display:block;font-size:var(--fs-l);color:var(--ink);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto{font-size:10.5px;letter-spacing:.08em;border:1px dashed var(--ink-3);color:var(--ink-2);padding:2px 7px}
.roles{display:flex;border:1px solid var(--strong)}
.roles button{background:var(--surface);border:0;padding:6px 12px;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;border-right:1px solid var(--line)}
.roles button:last-child{border-right:0}
.roles button small{font-size:10.5px;color:var(--ink-3)}
.roles button.on{background:var(--strong);color:var(--surface)}
.roles button.on small{color:var(--line-2)}
.bell{border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.bell b{font-family:var(--mono);margin-left:4px}
.bell.has{border-color:var(--strong);font-weight:700}
.view{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}

/* ---------- type & primitives ---------- */
h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:var(--fs-l);font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:var(--fs-m);font-weight:700;margin:0}
p{margin:0}
.lead{color:var(--ink-2);margin-top:6px;max-width:68ch}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sub{color:var(--ink-3);font-size:var(--fs-s)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--strong);padding-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;min-width:0}
.panel.a{border-left:4px solid var(--strong)}
.panel.b{border-top:3px solid var(--strong)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--strong);background:var(--surface);color:var(--ink);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.pri{background:var(--strong);color:var(--surface)}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:var(--line-2)}
.btn.danger{border-color:var(--signal);color:var(--signal)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

/* chips: 형태로 상태를 구분 */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border:1px solid var(--strong);line-height:1.6;white-space:nowrap;letter-spacing:.02em}
.chip.fill{background:var(--strong);color:var(--surface)}
.chip.dash{border-style:dashed;border-color:var(--ink-3);color:var(--ink-2);font-weight:600}
.chip.soft{border-color:var(--line-2);color:var(--ink-2);font-weight:600}
.chip.sig{border-color:var(--signal);color:var(--signal);background:var(--signal-bg)}
.chip.strike{border-color:var(--line-2);color:var(--ink-3);text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;color:var(--ink-2);background:var(--muted);padding:1px 7px}
.tag.on{background:var(--strong);color:var(--surface)}
button.tag{border:0;cursor:pointer}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label.f .req{color:var(--signal);margin-left:2px}
label.f>span:first-child .chip{margin-left:6px;vertical-align:1px}
label.f>.chip{align-self:flex-start}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--surface);padding:8px 10px;font-size:13.5px;font-weight:400;color:var(--ink);border-radius:0}
.in:focus{outline:none;border-color:var(--strong);box-shadow:inset 0 0 0 1px var(--strong)}
textarea.in{min-height:72px;resize:vertical;line-height:1.5}
.hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.warn{font-size:12px;color:var(--signal);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--strong)}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--strong);color:var(--surface);font-weight:700}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:2px solid var(--strong);white-space:nowrap;background:var(--surface)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--muted)}
table.t td.c,table.t th.c{text-align:center}
table.t td.r,table.t th.r{text-align:right}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface)}
.kpi{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-decoration:none}
.kpi:last-child{border-right:0}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi.dark{background:var(--inverse);color:var(--inverse-ink)}
.kpi.dark .l,.kpi.dark .s{color:var(--inverse-2)}
a.kpi:hover{background:var(--muted)}
a.kpi.dark:hover{background:#1c1c1c}

/* library cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.card:hover{border-color:var(--strong)}
.card.core{border-top:3px solid var(--strong)}
.card.local{border-style:dashed;border-color:var(--line-2)}
.card .th{background:var(--thumb-bg);aspect-ratio:16/10;max-width:100%;position:relative;border-bottom:1px solid var(--line)}
.card .th svg{width:100%;height:100%;display:block}
.card .fg{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .nm{font-weight:700;font-size:14.5px}
.card .mt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);margin-top:auto}

/* thumbnails */
.t-bg{fill:var(--thumb-bg)}.t-ink{fill:var(--thumb-ink)}.t-mid{fill:var(--thumb-mid)}.t-lt{fill:var(--thumb-lt)}.t-pp{fill:var(--thumb-paper)}
.t-dim{fill:var(--thumb-ink);fill-opacity:.28}

/* figma frame */
.frame{background:var(--thumb-bg);border:1px solid var(--line);position:relative;padding:26px 18px 18px}
.frame .fl{position:absolute;top:6px;left:10px;font-size:10.5px;font-family:var(--mono);color:var(--ink-3)}
.frame svg{width:100%;height:auto;display:block;max-width:100%}
.figbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:12.5px}
.figbox dt{color:var(--ink-3)}
.figbox dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.dot{width:7px;height:7px;background:var(--strong);display:inline-block}
.dot.sig{background:var(--signal)}
.dot.hollow{background:transparent;border:1.5px solid var(--ink-3)}

/* detail */
.dhead{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;margin-bottom:22px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px solid var(--line)}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-size:13.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button.on{border-bottom-color:var(--strong);color:var(--ink);font-weight:700}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line-2);padding:3px 9px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;background:var(--surface)}
.slot button{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:0 2px;font-size:13px}
.slot.add{border-color:var(--strong);font-weight:600}
.slot.del{border-color:var(--signal);color:var(--signal);text-decoration:line-through}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:86px 18px minmax(0,1fr);gap:10px;align-items:start}
.tl .ver{font-family:var(--mono);font-weight:600;font-size:13px;padding-top:12px;text-align:right}
.tl .ax{position:relative;align-self:stretch}
.tl .ax::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--line-2)}
.tl .ax i{position:absolute;left:3px;top:16px;width:11px;height:11px;background:var(--surface);border:2px solid var(--strong)}
.tl .ax i.M{background:var(--strong)}
.tl .ax i.p{border-color:var(--ink-3);width:9px;height:9px;left:4px;top:17px}
.tl .bx{padding:10px 0 14px;border-bottom:1px solid var(--line);min-width:0}

/* steps tracker */
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1;min-width:92px;padding:8px 10px 9px;border-top:3px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.step b{display:block;font-size:12.5px;color:inherit}
.step.done{border-top-color:var(--strong);color:var(--ink)}
.step.cur{border-top-color:var(--strong);color:var(--ink);background:var(--muted)}
.steps.tight .step{min-width:60px;padding-inline:6px}
.step.bad{border-top-color:var(--signal);color:var(--signal)}

/* bars */
.bar{height:8px;background:var(--muted);position:relative;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--strong)}
.bar .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.hbar a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* feed */
.feed{display:flex;flex-direction:column}
.feed .fi{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed .fi:last-child{border-bottom:0}
.feed .fi time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:2px}

/* review */
.qlist{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface)}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;border-left:4px solid transparent}
.qi:last-child{border-bottom:0}
.qi:hover{background:var(--muted)}
.qi.on{border-left-color:var(--strong);background:var(--muted)}
.qi.mine .who::after{content:"내 차례";margin-left:6px;font-size:10.5px;font-weight:800;background:var(--strong);color:var(--surface);padding:0 5px}
.diff{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.diff td,.diff th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.diff th{font-size:11px;color:var(--ink-3);border-bottom:2px solid var(--strong);font-weight:600}
.diff .a{color:var(--ink-3);text-decoration:line-through}
.diff .b{font-weight:600}
.verdict{border:2px solid var(--strong);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.verdict .lv{display:flex;align-items:baseline;gap:10px}
.verdict .lv b{font-family:var(--mono);font-size:22px}

/* file viewer */
.files{display:grid;grid-template-columns:270px minmax(0,1fr);border:1px solid var(--line);background:var(--surface);min-height:520px}
.tree{border-right:1px solid var(--line);padding:10px 0;font-family:var(--mono);font-size:12px;overflow:auto;max-height:640px}
.tree button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 12px;cursor:pointer;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tree button:hover{background:var(--muted);color:var(--ink)}
.tree button.on{background:var(--strong);color:var(--surface)}
.tree .dir{padding:6px 12px 2px;color:var(--ink);font-weight:600}
.code{margin:0;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.6;overflow:auto;max-height:600px;white-space:pre;color:var(--ink)}
.code .k{color:var(--ink-3)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;flex-wrap:wrap}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-top:4px solid var(--strong);width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--strong);background:var(--surface);margin-bottom:16px}
.banner.sig{border-color:var(--signal);background:var(--signal-bg)}
.banner.inv{background:var(--inverse);color:var(--inverse-ink);border-color:var(--inverse)}
.empty{padding:36px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2)}

function detectChanges(o, d){
  const ch=[]; const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  if(o.name!==d.name) ch.push({f:'블록명', from:o.name, to:d.name, lv:'MINOR'});
  if(o.cat!==d.cat) ch.push({f:'분류', from:CAT[o.cat], to:CAT[d.cat], lv:'MINOR'});
  if(o.node!==d.node) ch.push({f:'피그마 노드', from:o.node, to:d.node, lv: d.designChanged?'MINOR':'PATCH'});
  else if(d.designChanged) ch.push({f:'피그마 원본', from:'이전 디자인', to:'원본 변경 반영', lv:'MINOR'});
  const add=d.slots.filter(s=>!o.slots.includes(s)), del=o.slots.filter(s=>!d.slots.includes(s));
  add.forEach(s=>ch.push({f:'슬롯 추가', from:'', to:s, lv:'MINOR'}));
  del.forEach(s=>ch.push({f:'슬롯 삭제', from:s, to:'', lv:'MAJOR'}));
  if(o.desc!==d.desc) ch.push({f:'설명', from:o.desc, to:d.desc, lv:'PATCH'});
  if(o.context!==d.context) ch.push({f:'사용 맥락', from:o.context, to:d.context, lv:'PATCH'});
  if(!same(o.tags,d.tags)) ch.push({f:'태그', from:o.tags.join(', '), to:d.tags.join(', '), lv:'PATCH'});
  if(!same(o.platforms,d.platforms)) ch.push({f:'플랫폼', from:o.platforms.join(', '), to:d.platforms.join(', '), lv:'PATCH'});
  if(o.a11y!==d.a11y) ch.push({f:'접근성 검수', from:o.a11y?'통과':'미검수', to:d.a11y?'통과':'미검수', lv:'PATCH'});
  const lv = ch.reduce((m,c)=>LV_ORDER[c.lv]>LV_ORDER[m]?c.lv:m,'PATCH');
  return {changes:ch, level: ch.length?lv:null};
}
function promoOf(b){
  const proj=b.refs.length, refs=b.refs.reduce((a,r)=>a+r.uses,0);
  const majors=b.history.filter(h=>h.level==='MAJOR'||h.level==='INIT');
  const lastMajor = majors.length?majors[majors.length-1].date:b.created;
  const days = daysBetween(lastMajor, TODAY);
  const W=PROMO.weights;
  const sc = {projects:Math.min(proj/PROMO.target.projects,1)*W.projects, refs:Math.min(refs/PROMO.target.refs,1)*W.refs,
    stability:Math.min(days/90,1)*W.stability, a11y:b.a11y?W.a11y:0, readiness:(readiness(b.spec).pct/100)*W.readiness};
  const score = Math.round(Object.values(sc).reduce((a,c)=>a+c,0)*10)/10;
  const gates = {proj:proj>=4, a11y:b.a11y, stab:days>=90};
  return {proj, refs, days, lastMajor, sc, score, gates, ok: gates.proj&&gates.a11y&&gates.stab&&score>=PROMO.threshold};
}

  if(snap.designChanged){ b.figma.changed=false; b.figma.synced=TODAY; }

function tracker(r){
  const b=blk(r.block); const st=[{t:'요청', s:'done', d:`${uname(r.by)} · ${md(r.date)}`}];
  r.steps.forEach(s=>st.push({t: s.role==='admin'?'관리자 승인':'승인자 검토', s: s.state==='done'?'done':s.state==='rejected'?'bad':(r.status==='rejected'?'':'cur'), d: s.state==='done'?`${uname(s.by)} · ${md(s.date)}`:s.state==='rejected'?`반려 · ${md(s.date)}`:'대기'}));
  if(r.type==='new') st.push({t:'표준 반영', s: r.status==='done'?'done':r.status==='approved'?'cur':'', d: r.status==='done'?'완료':r.status==='approved'?'관리자 처리 중':'—'});

  return `<div class="steps">${st.map(x=>`<div class="step ${x.s}"><b>${x.t}</b>${x.d}</div>`).join('')}</div>`;

function diffTable(o, d){

  if(!changes.length) return '<p class="sub">바뀐 내용이 없습니다.</p>';
  return `<div class="tw"><table class="diff"><thead><tr><th>항목</th><th>이전</th><th>변경</th><th>판정</th></tr></thead><tbody>${changes.map(c=>`<tr><td>${c.f}</td><td class="a">${esc(c.from)||'—'}</td><td class="b">${esc(c.to)||'—'}</td><td>${chipLv(c.lv)}</td></tr>`).join('')}</tbody></table></div>`;

let toastT; function toast(msg){ clearTimeout(toastT); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.querySelectorAll('.toast').forEach(x=>x.remove()); document.body.appendChild(el); toastT=setTimeout(()=>el.remove(),3400); }

function canEdit(b){ const u=me(), role=ui.role; if(b.status==='deprecated') return false; if(b.tier==='local') return b.owner===u||role==='admin'; return true; }
function canDelete(b){ return ui.role==='admin' || (b.tier==='local' && b.owner===me()); }
function similar(name, tags, excludeId){
  const bi=s=>{const t=s.replace(/\s/g,'');const o=new Set();for(let i=0;i<t.length-1;i++)o.add(t.slice(i,i+2));return o};
  const A=bi(name||'');
  return S.blocks.filter(b=>b.id!==excludeId && b.tier!=='local').map(b=>{
    const B=bi(b.name); let inter=0; A.forEach(x=>{if(B.has(x))inter++});
    const nameSim = A.size&&B.size? (2*inter)/(A.size+B.size):0;
    const tagSim = tags.length? tags.filter(t=>b.tags.includes(t)).length/tags.length:0;
    return {b, s:Math.round((nameSim*.6+tagSim*.4)*100)};
  }).filter(x=>x.s>=15).sort((a,c)=>c.s-a.s).slice(0,3);
}
function glossaryHits(text){ const out=[]; S.glossary.forEach(g=>g.avoid.forEach(a=>{ if(text&&text.includes(a)) out.push({a, term:g.term}); })); return out; }
function parseFigma(url){
  const m=String(url).match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]+)\/([^?\s]*)\??([^\s]*)/);
  if(!m) return null; const nid=(m[3].match(/node-id=([0-9]+[-:][0-9]+)/)||[])[1];
  return {key:m[1], file:decodeURIComponent(m[2]||'').replace(/-/g,' ')||'Untitled', node: nid?nid.replace('-',':'):null};
}

    body=`<div class="tw"><table class="t"><thead><tr><th>프로젝트</th><th>참조 범위</th><th>받는 버전</th><th class="r">사용 화면</th><th>상태</th></tr></thead><tbody>${b.refs.map(r=>{const latest=[...b.history].reverse().find(h=>+h.v.split('.')[0]===r.pin)?.v||b.version; return `<tr><td><b>${PROJECTS[r.p]}</b> <span class="mono sub">${r.p}</span></td><td class="mono">^${r.pin}</td><td class="mono">${latest}</td><td class="r num">${r.uses}</td><td>${r.pin<M?`<span class="chip sig">업그레이드 필요 · ${M}.x</span>`:'<span class="chip soft">최신 반영</span>'}</td></tr>`}).join('')}</tbody></table></div>
    <p class="hint" style="margin-top:10px">프로젝트는 Major 범위로 참조합니다. 같은 Major 안의 Minor·Patch는 자동으로 반영되고, 새 Major는 각 프로젝트가 직접 올립니다.</p>`;}
  if(tab==='file'){ const p=pathOf(b); const cs=S.commits.filter(c=>c.files.includes(p));
    body=`<div class="panel" style="padding:0"><div class="fhead"><span>uxui-registry/${p}</span><button class="btn sm ghost" data-act="copy" data-src="fjson">복사</button></div><pre class="code" id="fjson">${hl(JSON.stringify(blockJSON(b),null,2))}</pre></div>
    <div class="sec" style="margin-top:16px"><h3>이 파일의 커밋</h3>${cs.length?`<div class="panel" style="padding:4px 18px"><div class="feed">${cs.map(c=>`<div class="fi"><time>${md(c.date)}</time><div><span class="mono sub">${c.hash}</span> ${esc(c.msg)} · ${uname(c.by)}</div></div>`).join('')}</div></div>`:`<p class="sub">이력 탭의 커밋 해시가 이 파일의 변경 기록입니다.</p>`}</div>`;}
  return `${banners.join('')}
  <div class="dhead"><div class="frame"><span class="fl">${esc(b.figma.file)} / ${b.figma.node}</span>${thumbSvg(b.thumb)}</div>
    <div class="stack" style="gap:12px;min-width:0">
      <div class="row" style="gap:6px">${chipTier(b.tier)}<span class="sub">${CAT[b.cat]}</span><span class="sub">·</span><span class="mono sub">${b.id}</span></div>
      <h1>${esc(b.name)} <span class="mono" style="font-size:18px;font-weight:600;color:var(--ink-3)">v${b.version}</span></h1>
      <p class="lead" style="margin:0">${esc(b.desc)}</p>
      <div class="kv" style="max-width:520px"><div>키</div><div class="mono">${b.key}</div><div>담당자</div><div>${uname(b.owner)}${b.project?` · ${PROJECTS[b.project]}`:''}</div><div>참조</div><div>${b.refs.length}개 프로젝트 · ${refTotal(b)}개 화면</div><div>구현 정보</div><div class="row" style="gap:6px"><button class="linkbtn" data-act="tab" data-v="spec">스펙 준비도 ${rd.pct}%</button><span class="sub">·</span>${b.code.connected?`<span class="mono">${b.code.component}</span>`:'<span class="sub">코드 연결 없음</span>'}</div></div>

}
function blockJSON(b){
  return {id:b.id, key:b.key, name:b.name, tier:TIER[b.tier].dir, category:b.cat, version:b.version, status:b.status, owner:uname(b.owner), project:b.project||undefined,
    tags:b.tags, description:b.desc, context:b.context, platforms:b.platforms, slots:b.slots, a11y:{reviewed:b.a11y}, docs_completeness:b.docs,
    figma:{file_key:b.figma.key, node_id:b.figma.node, file:b.figma.file, page:b.figma.page, synced_at:b.figma.synced, url:figUrl(b.figma)},
    guidance:{_source:'human', usage:b.guidance.usage, avoid:b.guidance.avoid, ai_assisted:!!b.guidance.aiAssisted, pending_ai_draft:!!b.guidance.aiDraft, confirmed_by:b.guidance.approvedBy?uname(b.guidance.approvedBy):null},
    spec:Object.assign({_source:'figma-auto', _readonly:true}, {component:b.spec.component, type:b.spec.type, figma_file_version:b.spec.fileVersion, extracted_at:b.spec.extractedAt, props:b.spec.props, variants:b.spec.variants, tokens:b.spec.tokens, hardcoded:b.spec.hardcoded, layout:b.spec.layout, instances:b.spec.instances, interactions:b.spec.interactions, readiness:readiness(b.spec).pct}),
    code: b.code.connected?{_source:'code-connect', framework:b.code.framework, package:b.code.pkg, component:b.code.component, path:b.code.path, props:Object.fromEntries(b.code.mapping.filter(m=>m.code).map(m=>[m.figma,m.code]))}:{_source:'code-connect', connected:false},
    references:b.refs.map(r=>({project:r.p, range:'^'+r.pin, screens:r.uses})), fork_of:b.forkOf||undefined,
    history:b.history.map(h=>({version:h.v, level:h.level, date:h.date, author:uname(h.by), summary:h.summary, commit:h.commit}))};
}
function hl(s){ return esc(s).replace(/(&quot;[^&\n]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2'); }

/* ================= 스펙·코드 (자동 추출 / Code Connect / 사람 가이드) ================= */
const typeChip = t => `<span class="chip soft mono" style="font-weight:500">${t}</span>`;
function readyPanel(sp, title){
  const r=readiness(sp);
  return `<div class="panel stack" style="gap:8px"><div class="row between"><h3>${title||'준비도 점검'}</h3>${r.ready?'<span class="chip fill">준비됨</span>':`<span class="chip sig">보완 ${r.fails}건</span>`}</div>
    ${r.checks.map(c=>`<div class="row" style="gap:8px;align-items:flex-start;flex-wrap:nowrap"><i class="dot ${c.ok?'':'sig'}" style="margin-top:7px;flex:none"></i><div class="grow"><div style="font-size:13px;${c.ok?'':'color:var(--signal);font-weight:600'}">${c.label}</div><div class="sub mono" style="font-size:11px">${esc(c.detail)}</div></div></div>`).join('')}
    <p class="hint">자동 추출이 쓸 만한 정보를 내려면 피그마 파일이 이 기준을 지켜야 합니다. 통과 비율은 승격 점수에 반영됩니다.</p></div>`;
}
function tokenChips(sp){
  return `<div class="stack" style="gap:6px">${Object.entries(sp.tokens).map(([k,v])=>`<div class="row" style="gap:4px"><span class="sub" style="width:76px">${k}</span>${v.map(t=>`<span class="tag mono">${t}</span>`).join('')}</div>`).join('')}
    ${sp.hardcoded.map(h=>`<div class="warn">직접 입력 값 · ${esc(h.layer)} ${h.prop} <span class="mono">${h.value}</span> → 토큰으로 교체 필요</div>`).join('')}</div>`;
}
function layoutKV(sp){ const L=sp.layout; return `<div class="kv"><div>배치</div><div>${L.autoLayout?'오토 레이아웃 · ':''+'<span class="warn">절대 위치</span> · '}${L.mode}${L.position?` · ${L.position}`:''}</div><div>간격 / 여백</div><div class="mono">${L.gap} / ${L.padding}</div><div>크기</div><div class="mono">W ${L.width} · H ${L.height}</div><div>텍스트 스타일</div><div class="mono">${sp.textStyles.join(', ')}</div></div>`; }
function propTable(b, sp){
  const map=b.code&&b.code.connected?b.code.mapping:[];
  return `<div class="tw"><table class="t" style="min-width:560px"><thead><tr><th>Figma 속성</th><th>유형</th><th>기본값</th><th>슬롯</th><th>코드 prop</th></tr></thead><tbody>${sp.props.map(p=>{const m=map.find(x=>x.figma===p.name);return `<tr><td><b>${esc(p.name)}</b></td><td>${typeChip(p.type)}</td><td class="sub">${esc(p.default)}</td><td>${b.slots.includes(p.name)?'연결':'<span class="sub">—</span>'}</td><td class="mono">${m&&m.code?m.code:'<span class="sub">매핑 없음</span>'}</td></tr>`}).join('')}</tbody></table></div>`;
}
function vSpecTab(b){

  const diff=b.figmaLatest?specDiff(sp,b.figmaLatest):[];
  const editable=canEdit(b)&&!b.pending;
  return `<div class="banner"><span class="row" style="gap:8px"><span class="chip fill">자동 추출</span><span class="sub">${sp.source} · ${esc(sp.component)} · 파일 <span class="mono">${sp.fileVersion}</span> · 추출 ${md(sp.extractedAt)}</span></span><button class="btn sm" data-act="resync" data-id="${b.id}">피그마와 다시 동기화</button></div>
  ${diff.length?`<div class="panel" style="border:2px solid var(--signal);margin-bottom:16px"><div class="row between" style="margin-bottom:8px"><h3>원본에서 바뀐 스펙 · ${md(b.figmaLatest.extractedAt)}</h3>${editable?`<a class="btn sm pri" href="#edit-${b.id}">수정 화면에서 반영</a>`:''}</div>
    <div class="tw" style="border:0"><table class="diff"><thead><tr><th>변경</th><th>대상</th><th>상세</th><th>판정</th></tr></thead><tbody>${diff.map(d=>`<tr><td>${d.kind}</td><td class="b">${esc(d.name)}</td><td class="sub mono">${esc(d.detail)}</td><td>${chipLv(d.lv)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="split"><div class="stack">
    <div class="sec"><div class="sec-h"><h2>속성 → 슬롯 → 코드</h2><span class="sub">${sp.type} · 속성 ${sp.props.length}</span></div>${propTable(b,sp)}
      ${sp.variants.length?`<div class="row" style="gap:6px"><span class="sub">변형</span>${sp.variants.map(v=>`<span class="tag">${esc(v.name)}: ${v.values.map(esc).join(' · ')}</span>`).join('')}</div>`:''}</div>
    <div class="grid2"><div class="panel stack" style="gap:10px"><h3>레이아웃</h3>${layoutKV(sp)}</div><div class="panel stack" style="gap:10px"><h3>바인딩된 토큰</h3>${tokenChips(sp)}</div></div>
    <div class="grid2"><div class="panel stack" style="gap:8px"><h3>포함한 블록</h3>${deps.length?deps.map(d=>`<a href="#block-${d.id}" style="text-decoration:none">${chipTier(d.tier)} ${esc(d.name)} <span class="mono sub">v${d.version}</span></a>`).join(''):'<p class="sub">없음</p>'}</div>
      <div class="panel stack" style="gap:8px"><h3>이 블록을 쓰는 블록</h3>${users.length?users.map(d=>`<a href="#block-${d.id}" style="text-decoration:none">${chipTier(d.tier)} ${esc(d.name)}</a>`).join('')+'<p class="hint">Major 변경 시 이 블록들도 영향 범위에 들어갑니다.</p>':'<p class="sub">없음</p>'}</div></div>
    ${sp.interactions.length?`<div class="panel stack" style="gap:6px"><h3>인터랙션</h3>${sp.interactions.map(i=>`<div style="font-size:13px">${esc(i.layer)} · ${i.trigger} → ${i.action}</div>`).join('')}<p class="hint">프로토타입 연결에서 읽은 값입니다. 상태 분기와 데이터 규칙은 아래 가이드에 사람이 적습니다.</p></div>`:''}
    <div class="sec"><div class="sec-h"><h2>가이드</h2><span class="sub">사람이 작성 · 동기화로 덮어쓰지 않음</span></div>
      <div class="panel"><div class="kv">
        <div>쓰는 상황</div><div>${esc(g.usage)||'<span class="sub">미작성</span>'}</div>
        <div>쓰지 않을 때</div><div>${g.avoid?esc(g.avoid):'<span class="warn">미작성 · AI가 블록을 고를 때 가장 필요한 정보입니다</span>'}${g.aiDraft?' <span class="chip dash">AI 초안 · 확인 필요</span>':''}</div>
        <div>확인</div><div>${g.approvedBy?`${uname(g.approvedBy)}${g.aiAssisted?' · AI 초안 기반':''}`:'<span class="sub">—</span>'}</div>
      </div>
      ${editable&&!g.avoid?`<div class="row" style="margin-top:12px"><button class="btn sm" data-act="g-ai" data-id="${b.id}">Claude로 초안 작성</button><span class="hint">추출한 스펙과 화면을 근거로 초안을 쓰고, 담당자가 확인해야 확정됩니다.</span></div>`:''}
      ${editable&&g.aiDraft?`<div class="row" style="margin-top:12px"><button class="btn sm pri" data-act="g-ok" data-id="${b.id}">초안 확인 완료</button><button class="btn sm ghost" data-act="g-drop" data-id="${b.id}">초안 버리기</button></div>`:''}
      </div></div>
  </div>
  <aside class="stack">${readyPanel(sp)}
    <div class="panel b stack" style="gap:10px"><div class="row between"><h3>코드 연결</h3>${c.connected?'<span class="chip fill">Code Connect</span>':'<span class="chip dash">연결 없음</span>'}</div>
      ${c.connected?`<div class="kv" style="grid-template-columns:72px minmax(0,1fr)"><div>컴포넌트</div><div class="mono">${c.component}</div><div>import</div><div class="mono">${c.pkg}</div><div>파일</div><div class="mono" style="font-size:11.5px;overflow-wrap:anywhere">${c.path}</div><div>관리</div><div>${c.owner}</div></div>

      :`<p class="sub">이 블록과 연결된 코드 컴포넌트가 없습니다. 매핑은 개발 저장소에서 Code Connect로 등록합니다.</p><button class="btn sm" data-act="cc-req" data-id="${b.id}">개발팀에 매핑 요청</button>`}

/* ================= 화면: 수정(버전 등급 자동 판정) ================= */
function startDraft(b){ ui.draft = Object.assign(snapOf(b), {id:b.id, designChanged:b.figma.changed, note:'', level:null}); }
function slotEditor(o, d){
  const keep=o.slots.map((s,i)=>d.slots.includes(s)?`<span class="slot">${esc(s)}<button type="button" data-act="slot-del" data-s="${esc(s)}" aria-label="${esc(s)} 삭제">×</button></span>`:`<span class="slot del">${esc(s)}<button type="button" data-act="slot-undo" data-s="${esc(s)}" aria-label="되돌리기">↺</button></span>`).join('');
  const add=d.slots.filter(s=>!o.slots.includes(s)).map(s=>`<span class="slot add">+ ${esc(s)}<button type="button" data-act="slot-del" data-s="${esc(s)}" aria-label="${esc(s)} 삭제">×</button></span>`).join('');
  return `<div class="slots">${keep}${add}</div>`;
}
function verdictBox(b){
  const d=ui.draft, o=snapOf(b); const {changes, level}=detectChanges(o,d);
  if(!changes.length) return `<div class="verdict"><span class="eyebrow">변경 등급 판정</span><p class="sub">아직 바뀐 내용이 없습니다. 항목을 수정하면 등급과 승인 경로가 여기 표시됩니다.</p></div>`;
  const lv = d.level && LV_ORDER[d.level]>LV_ORDER[level] ? d.level : level;
  const to = bump(b.version, lv, b.tier); const steps=approvalSteps(b, lv, me());
  const route = steps.length? steps.map(s=>s==='admin'?'관리자 승인':'승인자 검토').join(' → ')+' → 발행' : '승인 없이 즉시 발행';
  const opts=['PATCH','MINOR','MAJOR'].filter(x=>LV_ORDER[x]>=LV_ORDER[level]);
  return `<div class="verdict">
    <span class="eyebrow">변경 등급 판정</span>
    <div class="lv"><b>${b.version} → ${to}</b>${chipLv(lv)}</div>
    <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)">${changes.map(c=>`<li>${c.f}${c.to&&c.f.startsWith('슬롯')?` '${esc(c.to)}'`:c.from&&c.f.startsWith('슬롯')?` '${esc(c.from)}'`:''} → ${POLICY.levels[c.lv].label}</li>`).join('')}</ul>
    <label class="f">등급 조정 <select class="in" id="e_level">${opts.map(x=>`<option value="${x}" ${x===lv?'selected':''}>${POLICY.levels[x].label} · ${POLICY.levels[x].meaning}</option>`).join('')}</select><span class="hint">자동 판정보다 낮출 수 없습니다.</span></label>
    <div class="notice"><b>승인 경로</b><br>${b.tier==='local'?'프로젝트 블록은 담당자가 바로 수정합니다':route}${lv==='MAJOR'?`<br>참조 중인 ${b.refs.length}개 프로젝트에 업그레이드 안내가 발송되고, ${b.version.split('.')[0]}.x 는 90일 동안 병행 유지됩니다.`:''}</div>
    <button class="btn pri" data-act="edit-save">${steps.length&&b.tier!=='local'?'변경 검토 요청':'v'+to+' 발행'}</button>
  </div>`;
}
function vEdit(id){
  const b=blk(id); if(!b) return '<div class="empty">블록을 찾을 수 없습니다.</div>';
  if(!canEdit(b)) return `<div class="empty">이 블록을 수정할 권한이 없습니다. 프로젝트 블록은 담당자와 관리자만 수정합니다.</div>`;
  if(b.pending) return `<div class="empty">${b.pending} 검토가 끝난 뒤 수정할 수 있습니다. <a href="#review-${b.pending}">요청 보기</a></div>`;
  if(!ui.draft||ui.draft.id!==id) startDraft(b);
  const d=ui.draft;
  return `<div class="pagehead"><div><div class="eyebrow">블록 수정 · ${b.id}</div><h1>${esc(b.name)} <span class="mono" style="font-size:18px;color:var(--ink-3)">v${b.version}</span></h1><p class="lead">바뀐 항목을 보고 시스템이 Patch·Minor·Major를 판정합니다. 등급에 따라 바로 발행되거나 검토 요청이 만들어집니다.</p></div><a class="btn ghost" href="#block-${b.id}">취소</a></div>
  <div class="split"><form id="editform" class="stack" onsubmit="return false">
    <div class="panel b stack"><h2>Figma 원본</h2>
      <div class="fgrid"><label class="f">노드 ID<input class="in mono" id="e_node" value="${esc(d.node)}"></label>
        <div class="stack" style="gap:6px;justify-content:flex-end"><label class="check"><input type="checkbox" id="e_design" ${d.designChanged?'checked':''}><span>피그마 원본 디자인 변경을 이번 버전에 반영${b.figma.changed?` <span class="chip sig">${md(b.figma.changedAt)} 변경 감지</span>`:''}</span></label></div></div>
      <p class="hint">디자인이 같고 노드만 옮겨졌다면 체크하지 마세요. 노드 재매핑만은 Patch입니다.</p>
      ${b.figmaLatest?figDiffBox(b):''}
    </div>
    <div class="panel b stack"><h2>구성 슬롯</h2><div id="slotbox">${slotEditor(snapOf(b), d)}</div>

function readForm(){
  const f=ui.form, v=id=>document.getElementById(id);
  const val=id=>v(id)?v(id).value:'';
  f.name=val('f_name').trim(); f.key=val('f_key').trim(); f.cat=val('f_cat')||f.cat; if(v('f_proj')) f.project=v('f_proj').value;
  f.desc=val('f_desc'); f.context=val('f_ctx'); f.avoid=val('f_avoid'); f.tags=val('f_tags').split(',').map(s=>s.trim()).filter(Boolean); f.slots=val('f_slots').split(',').map(s=>s.trim()).filter(Boolean);
  f.platforms=[...document.querySelectorAll('[data-fpf]')].filter(x=>x.checked).map(x=>x.dataset.fpf); f.a11y=v('f_a11y').checked; if(v('f_aiok')) f.aiConfirmed=v('f_aiok').checked;
  if(v('f_reason')){ f.reason=v('f_reason').value; f.projects=[...document.querySelectorAll('[data-pj]')].filter(x=>x.checked).map(x=>x.dataset.pj); }
  const nu=val('f_fig').trim(); if(nu!==f.figUrl){ f.figUrl=nu; f.fig=parseFigma(nu); f.extract=null; setTimeout(startExtract,0); }
}
function submitForm(){
  readForm(); const f=ui.form, isReq=f.mode==='request';
  const miss=[]; if(isReq&&!f.reason.trim())miss.push('요청 사유'); if(!f.fig)miss.push('피그마 프레임 링크'); if(!f.name)miss.push('블록명'); if(!/^[a-z0-9-]+$/.test(f.key))miss.push('키(영문 소문자·숫자·하이픈)'); if(!f.desc.trim())miss.push('설명'); if(!f.slots.length)miss.push('구성 슬롯');
  if(miss.length) return toast(`입력이 필요합니다: ${miss.join(', ')}`);
  if(!f.fig.node) return toast('피그마 링크에 node-id가 없습니다. 프레임을 선택한 상태에서 링크를 복사하세요.');
  if(!f.extract||f.extract.state!=='done') return toast('피그마에서 스펙을 가져오는 중입니다. 끝난 뒤 다시 누르세요.');
  if(f.aiDraft&&!f.aiConfirmed){ document.getElementById('f_aiok').focus(); return toast('AI 초안을 확인했다는 항목에 체크하세요.'); }
  const rd=readiness(f.extract.spec);
  if(!isReq&&f.tier==='std'&&!rd.ready) return toast(`준비도 점검 ${rd.fails}건이 미통과입니다. 표준 블록은 피그마 파일을 보완한 뒤 등록하세요.`);
  let b = f.srcId?blk(f.srcId):null;
  const tier = isReq?'local':f.tier;
  const guidance={usage:f.context, avoid:f.avoid, aiDraft:false, aiAssisted:!!f.aiDraft, approvedBy:me()};
  if(!b){
    b={id:nextBlockId(), name:f.name, key:f.key, tier, cat:f.cat, thumb:f.thumb||guessKind(f.name), tags:f.tags, owner:me(), project: tier==='local'?f.project:null, a11y:f.a11y, docs:60, slots:f.slots, desc:f.desc, context:f.context, platforms:f.platforms,
      status:'active', version: tier==='local'?'0.1.0':'1.0.0', history:[], refs: tier==='local'?[{p:f.project, pin:0, uses:1}]:[], pending:null, forkOf:null, created:TODAY,
      figma:{key:f.fig.key, file:f.fig.file, page:CAT[f.cat], node:f.fig.node, synced:TODAY, changed:false}, spec:clone(f.extract.spec), code:{connected:false}, guidance, figmaLatest:null};
    b.spec.component='Block/'+pascal(b.key); syncSpecWithSlots(b);
    b.history.push({v:b.version, level:'INIT', date:TODAY, by:me(), summary: tier==='local'?'프로젝트 블록 최초 등록':'표준 블록 등록 (관리자 직접)', commit:hex(b.id+'init'), snap:snapOf(b)});
    S.blocks.push(b); commit(`add: ${b.name} ${b.version} (${TIER[tier].label}) · spec 자동 추출`, [pathOf(b)]);
  } else { Object.assign(b,{name:f.name, cat:f.cat, tags:f.tags, slots:f.slots, desc:f.desc, context:f.context, platforms:f.platforms, a11y:f.a11y, guidance}); b.figma.node=f.fig.node; b.thumb=f.thumb||b.thumb; syncSpecWithSlots(b); }
  if(isReq){
    const r=createRequest({type:'new', block:b.id, reason:f.reason.trim(), projects:f.projects, resubmitOf:f.resubmitOf, steps:[{role:'approver',state:'pending'}]});
    b.pending=r.id; ui.form=null; toast(`${r.id} 등록 요청을 보냈습니다. 승인자에게 알림이 갔습니다.`); go('#review-'+r.id);
  } else { ui.form=null; toast(`${b.name} v${b.version} 등록됨`); go('#block-'+b.id); }

  if(notes.length) parts.push(`<div class="panel stack" style="gap:10px"><span class="eyebrow">검토 의견</span>${notes.map(s=>`<div style="border-left:${s.state==='rejected'?'4px solid var(--signal)':'2px solid var(--strong)'};padding-left:12px"><div class="sub">${uname(s.by)} · ${s.role==='admin'?'관리자':'승인자'} · ${md(s.date)} · ${s.state==='rejected'?'반려':'승인'}</div><p style="margin-top:4px">${esc(s.note)}</p></div>`).join('')}</div>`);
  if(r.type==='new'&&r.status==='approved'){
    const R=r.reflect;
    parts.push(`<div class="panel a stack" style="gap:10px"><h3>표준 반영 절차</h3><p class="sub">세 단계를 모두 마치면 블록이 표준 블록 v1.0.0으로 전환되고 요청자에게 알림이 갑니다.</p>
      ${[['figma','피그마 Standard Patterns 라이브러리에 게시'],['file',`저장소 이동: blocks/local → blocks/standard/${b.cat}/${b.key}.json`],['doc','가이드 문서 작성 (사용 맥락·슬롯·금지 사례)']].map(([k,l])=>`<label class="check"><input type="checkbox" data-act="reflect" data-id="${r.id}" data-k="${k}" ${R[k]?'checked':''} ${turn?'':'disabled'}>${l}</label>`).join('')}
      ${turn?`<div><button class="btn pri" data-act="reflect-done" data-id="${r.id}" ${R.figma&&R.file&&R.doc?'':'disabled'}>표준 반영 완료</button></div>`:'<p class="hint">관리자가 처리합니다.</p>'}</div>`);
  }
  if(turn&&r.status!=='approved') parts.push(`<div class="panel a stack" style="gap:10px"><h3>${r.steps.find(s=>s.state==='pending').role==='admin'?'관리자 결정':'검토 결정'}</h3>
    <label class="f">의견 <span class="hint">반려할 때는 필수. 요청자에게 그대로 전달됩니다</span><textarea class="in" id="rvnote" placeholder="${r.type==='new'?'예: 버튼 그룹 규격을 따르도록 반영해 주세요':'예: 참조 프로젝트 영향 확인했습니다'}"></textarea></label>
    <div class="row"><button class="btn pri" data-act="rv-approve" data-id="${r.id}">승인</button><button class="btn danger" data-act="rv-reject" data-id="${r.id}">반려</button></div></div>`);
  else if(!turn&&!['done','rejected'].includes(r.status)) parts.push(`<div class="notice">지금은 ${r.status==='approved'?'관리자':(r.steps.find(s=>s.state==='pending').role==='admin'?'관리자':'승인자')} 차례입니다. ${ui.role!=='admin'&&ui.role!=='approver'?'':'역할을 바꿔 처리해 보세요.'}</div>`);
  if(r.status==='rejected'&&r.by===me()&&!S.requests.some(x=>x.resubmitOf===r.id)) parts.push(`<div class="banner sig"><span>반려 사유를 반영해 다시 요청할 수 있습니다.</span><a class="btn sm" href="#request-from-${r.block}">보완 후 재요청</a></div>`);
  return `<div class="stack">${parts.join('')}</div>`;
}
function rvApprove(id){
  const r=req(id); const note=(document.getElementById('rvnote')?.value||'').trim();
  if(r.type==='promote' && [...document.querySelectorAll('.pc')].some(x=>!x.checked)) return toast('승격 체크리스트를 모두 확인하세요.');
  const st=r.steps.find(s=>s.state==='pending'); Object.assign(st,{state:'done', by:me(), date:TODAY, note:note||(r.type==='new'?'표준 등록 승인':'승인')});
  const next=r.steps.find(s=>s.state==='pending');
  commit(`review: ${r.id} ${st.role==='admin'?'관리자':'1단계'} 승인`, [`requests/${r.id}.json`]);
  if(next){ r.status='review'; notify(usersOfRole(next.role), `${next.role==='admin'?'최종 승인 대기':'검토 대기'}: ${r.id} ${blk(r.block).name}`, '#review-'+r.id); notify(r.by, `${r.id} 1단계 승인 완료. ${next.role==='admin'?'관리자':'승인자'} 승인 대기 중`, '#requests'); toast(`승인했습니다. 다음 단계: ${next.role==='admin'?'관리자 승인':'승인자 검토'}`); }
  else { finalize(r); toast(r.type==='version'?`승인 완료 · ${blk(r.block).name} v${blk(r.block).version} 발행`:r.type==='promote'?`${blk(r.block).name} Core 가이드로 승격`:'승인 완료 · 관리자 표준 반영 대기'); }
  render();
}
function rvReject(id){
  const r=req(id); const note=(document.getElementById('rvnote')?.value||'').trim();
  if(!note){ document.getElementById('rvnote').focus(); return toast('반려 사유를 입력하세요. 요청자가 보완할 수 있도록 구체적으로 적어 주세요.'); }
  const st=r.steps.find(s=>s.state==='pending'); Object.assign(st,{state:'rejected', by:me(), date:TODAY, note}); r.status='rejected';
  const b=blk(r.block); if(b.pending===r.id) b.pending=null;
  notify(r.by, `${r.id} ${b.name} 요청이 반려되었습니다: ${note}`, '#review-'+r.id); commit(`review: ${r.id} 반려`, [`requests/${r.id}.json`]);
  toast('반려했습니다. 요청자에게 사유가 전달되었습니다.'); render();
}
function reflectDone(id){
  const r=req(id), b=blk(r.block); const old=pathOf(b);
  b.tier='std'; b.project=null; b.version='1.0.0'; b.pending=null; b.figma.key=figKey(b); b.figma.file=figFile(b); b.figma.synced=TODAY; b.docs=Math.max(b.docs,80);
  b.history.push({v:'1.0.0', level:'MAJOR', date:TODAY, by:me(), summary:`표준 블록으로 등록 (${r.id} 승인, 가이드 외 → 표준)`, commit:hex(b.id+'std'), snap:snapOf(b)});
  b.refs.forEach(x=>x.pin=1);
  r.status='done'; commit(`register: ${b.name} 1.0.0 (local → standard)`, [old, pathOf(b), 'glossary/terms.json']);
  notify([r.by,'u3'], `${b.name}이(가) 표준 블록 v1.0.0으로 반영되었습니다. 이제 모든 프로젝트에서 쓸 수 있습니다.`, '#block-'+b.id);
  toast(`${b.name} 표준 블록 v1.0.0으로 반영 완료`); render();
}

바이브 코딩으로 화면을 만들거나 고칠 때 아래 순서를 따른다.

1. 이름은 glossary/terms.json 의 표준 용어로 짓는다.
   avoid 목록에 있는 말(예: 팝업, 스낵바)은 쓰지 않는다.
2. 필요한 패턴을 blocks/core → blocks/standard 순서로 찾는다.
   있으면 slots 정의대로 조립하고, 화면에 block id와 version을 주석으로 남긴다.
3. 맞는 블록이 없으면 blocks/local 에 프로젝트 블록(0.x)으로 만들고
   requests/ 에 신규 등록 요청(type=new)을 남긴다. 표준 폴더에 직접 쓰지 않는다.
4. 블록을 고칠 때는 policy/version-approval.json 의 등급 판정을 따른다.
   슬롯 삭제는 항상 MAJOR 이다.
5. figma.node_id 가 디자인 원본이다. 원본과 다르게 구현하지 않는다.
6. 블록 파일의 세 영역을 구분해서 읽는다.
   - spec: 피그마에서 자동 추출한 구조(속성, 토큰, 레이아웃). 값은 토큰 이름으로 쓴다.
   - code: 실제 코드 컴포넌트와 import 경로. 있으면 새로 만들지 말고 import 한다.
   - guidance: 쓰는 상황과 쓰지 않을 때. 블록을 고를 때 가장 먼저 본다.
     pending_ai_draft 가 true 인 내용은 아직 확인 전이므로 무시한다.
7. spec.hardcoded 에 있는 값은 토큰으로 바꿔 구현하고 담당자에게 알린다.

`;
  F['CHANGELOG.md']=`# CHANGELOG\n\n`+S.blocks.flatMap(b=>b.history.filter(h=>h.level!=='INIT').map(h=>({b,h}))).sort((x,y)=>y.h.date.localeCompare(x.h.date)).slice(0,30).map(({b,h})=>`- ${h.date}  ${b.name} ${h.v}  [${h.level}]  ${h.summary}  (${h.commit})`).join('\n')+'\n';

  F['schema/taxonomy.json']={tiers:{core:'Core 가이드', standard:'표준 블록', local:'프로젝트 블록(가이드 외)'}, categories:CAT, tags};
  F['policy/version-approval.json']=POLICY;
  F['policy/promotion.json']=PROMO;
  F['policy/roles.json']={roles:{requester:'요청자', approver:'승인자', admin:'관리자'}, members:Object.fromEntries(Object.entries(USERS).map(([k,u])=>[u.name,u.role]))};
  F['policy/workflow.json']=WORKFLOW;
  F['policy/figma-extraction.json']=EXTRACTION;

let lastRoute='';
function render(){
  const h=(location.hash.slice(1)||'home'); let title='', html='', sec='';

  else if(h==='library'){title='블록 라이브러리'; html=vLibrary(); sec='library';}
  else if(h.startsWith('block-')){const id=h.slice(6); title=blk(id)?.name||'블록'; if(lastRoute!==h){ ui.tab=ui.nextTab||'overview'; ui.nextTab=null; } html=vBlock(id); sec='library';}
  else if(h.startsWith('edit-')){const id=h.slice(5); title='블록 수정'; html=vEdit(id); sec='library';}
  else if(h.startsWith('compare-')){title='버전 비교'; html=vCompare(h.slice(8)); sec='library';}
  else if(h==='new-block'){title='블록 등록'; html=vForm('new',null); sec='new-block';}
  else if(h==='request-new'){title='신규 등록 요청'; html=vForm('request',null); sec='requests';}
  else if(h.startsWith('request-from-')){title='신규 등록 요청'; html=vForm('request',h.slice(13)); sec='requests';}
  else if(h==='requests'){title='등록 요청'; html=vRequests(); sec='requests';}
  else if(at('review')){title='승인함'; html=vReview(h.length>6?h.slice(7):null); sec='review';}
  else if(h==='promotion'){title='승격 관리'; html=vPromotion(); sec='promotion';}
  else if(h==='notifications'){title='알림'; html=vNotifs(); sec='';}
  else if(h==='foundation'){title='공유 기반'; html=vFoundation(); sec='foundation';}
  else if(h==='roles'){title='역할·정책'; html=vRoles(); sec='roles';}
  else {title='대시보드'; html=vHome(); sec='home';}

  bell.className='bell'+(unread?' has':''); bell.innerHTML=`알림<b>${unread}</b>`;

document.addEventListener('click', e=>{

    case 'role': ui.role=d.r; ui.draft=null; ui.form=null; ui.rq='mine'; render(); toast(`${ROLE_LABEL[d.r]} ${USERS[ROLE_USER[d.r]].name}(으)로 전환했습니다`); break;

    case 'dup': { const s=blk(d.id); const b=clone(s); b.id=nextBlockId(); b.name=s.name+' 사본'; b.key=s.key+'-copy'; b.tier='local'; b.owner=me(); b.project=USERS[me()].project||'P01'; b.version='0.1.0'; b.refs=[]; b.pending=null; b.forkOf=s.id; b.status='active';
      b.figma.changed=false; b.figmaLatest=null; b.code={connected:false}; b.guidance=Object.assign({},s.guidance,{approvedBy:me()}); b.history=[{v:'0.1.0', level:'INIT', date:TODAY, by:me(), summary:`${s.name} v${s.version}에서 복제`, commit:hex(b.id), snap:snapOf(b)}]; b.created=TODAY;
      S.blocks.push(b); commit(`fork: ${s.name} ${s.version} → ${b.id}`, [pathOf(b)]); toast(`${b.name}을(를) 프로젝트 블록으로 복제했습니다`); go('#block-'+b.id); break; }
    case 'del': { const b=blk(d.id); const used=refTotal(b)>0;
      modal(`<span class="eyebrow">${used?'사용 중단':'삭제'}</span><h2>${esc(b.name)} ${used?'사용 중단':'삭제'}</h2>${used?`<p>${b.refs.length}개 프로젝트, ${refTotal(b)}개 화면에서 참조하고 있어 바로 삭제할 수 없습니다. 사용 중단으로 표시하고 90일 뒤(${addDays(TODAY,90)}) 보관 처리합니다. 참조 프로젝트에 알림이 갑니다.</p>`:'<p>참조하는 화면이 없습니다. 파일을 보관 폴더로 옮기고 라이브러리에서 숨깁니다. 이력은 남습니다.</p>'}
        <label class="f">사유<span class="req">*</span><input class="in" id="delwhy" placeholder="예: 결제 수단 개편으로 대체 블록 사용"></label><div class="row"><button class="btn ${used?'pri':'danger'}" data-act="del-ok" data-id="${b.id}">${used?'사용 중단':'삭제'}</button><button class="btn ghost" data-act="modal-cancel">취소</button></div>`); break; }
    case 'del-ok': { const b=blk(d.id); const why=document.getElementById('delwhy').value.trim(); if(!why) return toast('사유를 입력하세요.');
      if(refTotal(b)>0){ b.status='deprecated'; b.sunset=addDays(TODAY,90); commit(`deprecate: ${b.name} (${why})`, [pathOf(b)]); notify(['u1','u2'], `${b.name} 사용 중단 예정 (${b.sunset}). 사유: ${why}`, '#block-'+b.id); closeModal(); toast('사용 중단으로 표시했습니다'); render(); }
      else { S.blocks=S.blocks.filter(x=>x.id!==b.id); commit(`archive: ${b.name} (${why})`, [pathOf(b), 'archive/'+b.key+'.json']); closeModal(); toast(`${b.name}을(를) 삭제했습니다 (보관 폴더로 이동)`); go('#library'); }
      break; }
    case 'slot-add': { const i=document.getElementById('e_slotin'); const v=i.value.trim(); if(!v) return; readEdit(); if(!ui.draft.slots.includes(v)) ui.draft.slots.push(v); i.value=''; refreshEdit(); i.focus(); break; }
    case 'slot-del': readEdit(); ui.draft.slots=ui.draft.slots.filter(s=>s!==d.s); refreshEdit(); break;
    case 'slot-undo': { readEdit(); const o=blk(ui.draft.id).slots; ui.draft.slots.push(d.s); ui.draft.slots.sort((x,y)=>(o.indexOf(x)+1||99)-(o.indexOf(y)+1||99)); refreshEdit(); break; }
    case 'edit-save': saveEdit(); break;
    case 'rollback': { const b=blk(d.id); modal(`<span class="eyebrow">롤백</span><h2>${esc(b.name)} v${b.version} → v${d.v} 내용</h2><p class="sub">이력은 지워지지 않고 새 버전이 발행됩니다. 승인자에게 사후 알림이 갑니다.</p>${diffTable(snapOf(b), b.history.find(h=>h.v===d.v).snap)}<label class="f">사유<span class="req">*</span><input class="in" id="rbwhy" placeholder="예: 2.3.0 배지 겹침으로 카드 높이 깨짐"></label><div class="row"><button class="btn pri" data-act="rollback-ok" data-id="${b.id}" data-v="${d.v}">롤백 실행</button><button class="btn ghost" data-act="modal-cancel">취소</button></div>`); break; }
    case 'rollback-ok': { const why=document.getElementById('rbwhy').value.trim(); if(!why) return toast('롤백 사유를 입력하세요.'); closeModal(); doRollback(d.id, d.v, why); break; }
    case 'f-tier': readForm(); ui.form.tier=d.v; render(); break;
    case 'fig-sample': { const i=document.getElementById('f_fig'); const nm=(document.getElementById('f_name').value||'New-Block').replace(/\s+/g,'-'); i.value=`https://www.figma.com/design/Qa7Wd3UXUIPrj/${encodeURIComponent((PROJECTS[ui.form.project]||'Project').replace(/\s+/g,'-'))}?node-id=${1200+Math.floor(Math.random()*700)}-${4000+Math.floor(Math.random()*5000)}`; readForm(); refreshSide(); break; }
    case 'form-submit': submitForm(); break;
    case 'use-props': { readForm(); const x=ui.form.extract; if(!x||x.state!=='done') return; ui.form.slots=x.spec.props.filter(p=>x.use[p.name]!==false).map(p=>p.name); document.getElementById('f_slots').value=ui.form.slots.join(', '); refreshSide(); toast(`슬롯 ${ui.form.slots.length}개를 피그마 속성에서 채웠습니다`); break; }
    case 'ai-draft': { readForm(); const f=ui.form; if(!f.extract||f.extract.state!=='done') return toast('피그마에서 스펙을 먼저 가져오세요. 초안은 추출한 스펙을 근거로 씁니다.'); const d=aiDraft(f.name||'새 블록', f.extract.spec, f.cat); f.desc=d.desc; f.context=d.usage; f.avoid=d.avoid; f.aiDraft=true; f.aiConfirmed=false; render(); toast('Claude 초안을 채웠습니다. 사실과 맞는지 확인하고 고쳐 주세요.'); break; }
    case 'apply-figdiff': { readEdit(); const b=blk(ui.draft.id); specDiff(b.spec,b.figmaLatest).forEach(x=>{ if(x.slot==='add'&&!ui.draft.slots.includes(x.name)) ui.draft.slots.push(x.name); if(x.slot==='del') ui.draft.slots=ui.draft.slots.filter(s=>s!==x.name); }); ui.draft.designChanged=true; document.getElementById('e_design').checked=true; if(!ui.draft.note){ ui.draft.note='피그마 원본 변경 반영: '+specDiff(b.spec,b.figmaLatest).filter(x=>x.slot).map(x=>`${x.kind} '${x.name}'`).join(', '); document.getElementById('e_note').value=ui.draft.note; } refreshEdit(); toast('피그마 변경을 슬롯에 반영했습니다. 등급을 확인하세요.'); break; }
    case 'resync': { const b=blk(d.id); if(b.figmaLatest){ b.figma.changed=true; toast('원본에서 바뀐 스펙이 있습니다. 아래 차이를 확인하세요.'); render(); } else { b.figma.synced=TODAY; b.spec.extractedAt=TODAY; commit(`sync: ${b.name} spec 재추출 (변경 없음)`, [pathOf(b)]); render(); toast('피그마와 다시 동기화했습니다. 바뀐 스펙이 없습니다.'); } break; }
    case 'snippet': { const b=blk(d.id); modal(`<span class="eyebrow">사용 예시 · ${esc(b.code.component)}</span><h2>${esc(b.name)} v${b.version}</h2><p class="sub">Figma MCP의 디자인 컨텍스트와 Code Connect 매핑으로 만든 참고 코드입니다. 레지스트리에 저장하지 않습니다.</p><pre class="code" id="snip" style="border:1px solid var(--line);max-height:320px">${esc(codeSnippet(b))}</pre><div class="row"><button class="btn pri" data-act="copy" data-src="snip">복사</button><button class="btn ghost" data-act="modal-cancel">닫기</button></div>`); break; }
    case 'cc-req': { const b=blk(d.id); notify(usersOfRole('admin'), `Code Connect 매핑 요청: ${b.name} (${uname(me())})`, '#block-'+b.id); commit(`request: ${b.name} Code Connect 매핑 요청`, ['requests/code-connect.json']); toast('개발팀 매핑 요청을 남겼습니다. 관리자에게 알림이 갔습니다.'); break; }
    case 'g-ai': { const b=blk(d.id); const x=aiDraft(b.name, b.spec, b.cat); b.guidance.avoid=x.avoid; b.guidance.aiDraft=true; b.guidance.approvedBy=null; render(); toast('Claude 초안을 넣었습니다. 확인 전까지 AI 컨텍스트에 포함되지 않습니다.'); break; }
    case 'g-ok': { const b=blk(d.id); b.guidance.aiDraft=false; b.guidance.aiAssisted=true; b.guidance.approvedBy=me(); commit(`guidance: ${b.name} 쓰지 않을 때 확정 (AI 초안 기반)`, [pathOf(b)]); render(); toast('가이드를 확정했습니다'); break; }
    case 'g-drop': { const b=blk(d.id); b.guidance.avoid=''; b.guidance.aiDraft=false; render(); break; }
    case 'rq': ui.rq=d.v; go('#review'); break;
    case 'rv-approve': rvApprove(d.id); break;
    case 'rv-reject': rvReject(d.id); break;
    case 'reflect': { const r=req(d.id); r.reflect[d.k]=t.checked; render(); break; }
    case 'reflect-done': reflectDone(d.id); break;
    case 'promo': promote(d.id); break;
    case 'ntf': { const n=S.notifs.find(x=>x.id==d.id); if(n) n.read=true; break; }
    case 'read-all': S.notifs.forEach(n=>{if(n.to===me()) n.read=true}); render(); break;
    case 'file': ui.file=d.f; render(); break;
    case 'openfile': ui.file=d.f; break;
    case 'g-add': { const term=document.getElementById('g_term').value.trim(), avoid=document.getElementById('g_avoid').value.split(',').map(s=>s.trim()).filter(Boolean), def=document.getElementById('g_def').value.trim();
      if(!term||!def) return toast('표준 용어와 정의를 입력하세요.'); if(S.glossary.some(g=>g.term===term)) return toast('이미 있는 용어입니다.');
      S.glossary.push({term, avoid, def}); commit(`glossary: '${term}' 추가`, ['glossary/terms.json']); ui.file='glossary/terms.json'; toast(`'${term}'을(를) 용어 사전에 추가하고 커밋했습니다`); render(); break; }
    case 'copy': { const el=document.getElementById(d.src); const txt=el.innerText; try{ navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다'),()=>selectText(el)); }catch(_){ selectText(el); } break; }
  }
});
function selectText(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('선택했습니다. 복사 단축키로 복사하세요.'); }
function refreshSide(){ const f=ui.form; const th=document.getElementById('f_thumb'); if(th&&!f.thumbManual) th.value=guessKind(f.name); document.getElementById('side').innerHTML=formSide(); }
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='libq'){ ui.lib.q=t.value; document.getElementById('libres').innerHTML=libResults(); return; }
  if(t.id==='libcat'){ ui.lib.cat=t.value; render(); return; }
  if(t.id==='cmp_a'||t.id==='cmp_b'){ ui.cmp[t.id==='cmp_a'?'a':'b']=t.value; render(); return; }
  if(t.id==='e_level'){ ui.draft.level=t.value; refreshEdit(); return; }
  if(t.closest('#editform')){ if(t.id==='e_slotin') return; readEdit(); document.getElementById('verdict').innerHTML=verdictBox(blk(ui.draft.id)); return; }
  if(t.id==='f_from'){ go(t.value?'#request-from-'+t.value:'#request-new'); return; }
  if(t.dataset&&t.dataset.useprop){ ui.form.extract.use[t.dataset.useprop]=t.checked; return; }
  if(t.closest('#newform')){ if(t.id==='f_thumb'){ ui.form.thumbManual=true; } readForm(); if(ui.form.thumbManual) ui.form.thumb=document.getElementById('f_thumb').value; else ui.form.thumb=null; refreshSide(); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'&&document.querySelector('.scrim')) closeModal();
  if(e.key==='Enter'&&e.target.id==='e_slotin'){ e.preventDefault(); document.querySelector('[data-act="slot-add"]').click(); }
});
window.addEventListener('hashchange', render);
S = buildState();
render();

</script>

</body></html>
